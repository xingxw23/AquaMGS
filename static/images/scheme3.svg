  <text x="675" y="345" font-size="17" text-anchor="middle" fill="#66727b">continuous pose and morphology</text>

  <rect x="940" y="105" width="340" height="280" rx="18" fill="#f5faf2" stroke="#a9c69b" stroke-width="3"/>
  <text x="1110" y="145" font-size="22" font-weight="700" text-anchor="middle" fill="#506d47">Novel View</text>
