  <text x="675" y="145" font-size="22" font-weight="700" text-anchor="middle" fill="#555a89">3D Geometry</text>
  <g fill="#6d8faf" opacity=".8"><circle cx="560" cy="240" r="7"/><circle cx="590" cy="210" r="6"/><circle cx="620" cy="270" r="7"/><circle cx="650" cy="222" r="8"/><circle cx="685" cy="260" r="7"/><circle cx="720" cy="205" r="7"/><circle cx="750" cy="255" r="6"/><circle cx="785" cy="225" r="7"/></g>
